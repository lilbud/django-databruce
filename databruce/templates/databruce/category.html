{% extends "databruce/narrow_layout.html" %}
{% block title %}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        {% block info_row %}
        {% endblock info_row %}
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <div class="row align-items-end d-flex row-gap-2 gx-1 mb-3">
              <!-- Search -->
              <div class="col">
                <label for="search" class="pb-1">Search</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>
                  <input type="text"
                         id="search"
                         class="form-control form-control-sm"
                         placeholder="Type to search table...">
                </div>
              </div>
              <div class="col-12 col-md-auto mt-2 mt-md-0">
                <button type="button"
                        id="sbButton"
                        data-bs-toggle="modal"
                        data-bs-target="#sbModal"
                        class="btn btn-sm bi bi-search icon-button btn-primary w-100 gap-1 search">
                  Searchbuilder
                </button>
              </div>
            </div>
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display"
                       id="{% spaceless %}
                             {% block table_id %}
                             {% endblock table_id %}
                           {% endspaceless %}">
                  {% block table %}
                  {% endblock table %}
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
