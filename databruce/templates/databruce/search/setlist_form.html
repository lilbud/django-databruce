<div class="row g-2 align-items-center song-row" id="song_row-0">
    <label class="col-form-label text-sm col-auto d-flex align-items-center me-2"
           for="song">
        Song:
        <button name="button"
                type="button"
                class="btn btn-sm btn-link ms-2 p-0"
                id="remove-form-btn"
                onclick="removeForm(this)">
            <i class="btn-icon">
                <i class="bi bi-x-circle-fill text-danger"></i>
            </i>
        </button>
    </label>
    <div class="col-12 col-lg-4">{{ form.song1 }}</div>
    <div class="col-6 col-lg-1">{{ form.choice }}</div>
    <div class="col-6 col-lg-2">{{ form.position }}</div>
    <div class="col-12 col-lg">{{ form.song2 }}</div>
</div>
