<div class="row g-2 align-items-center song-row" id="song_row-0">
  <label class="form-label text-sm col-auto d-flex align-items-center mt-0 mb-1 me-2"
         for="song">
    Song:
    <button name="button"
            type="button"
            class="btn btn-link text-danger p-0 ms-2"
            id="remove-form-btn"
            onclick="removeForm(this)">
      <i class="bi bi-x-circle-fill"></i>
    </button>
  </label>
  <div class="col-12 col-lg-4 mt-lg-0">{{ form.song1 }}</div>
  <div class="col-6 col-lg-1 mt-lg-0">{{ form.choice }}</div>
  <div class="col-6 col-lg-2 mt-lg-0">{{ form.position }}</div>
  <div class="col-12 col-lg mt-lg-0">{{ form.song2 }}</div>
</div>
