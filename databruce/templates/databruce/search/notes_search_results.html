{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col">
    <div class="text-2xl text-nowrap mb-2">Setlist Notes Search</div>
    <div class="card mb-2">
      <div class="card-body">
        <div class="row d-flex gy-2 gy-md-0">
          <div class="prefix-container">
            <span class="prefix">Query</span>
            <span class="value">{{ query }}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="row align-items-end d-flex row-gap-2 gx-2" id="tableControls">
          <!-- Search -->
          <div class="col">
            <label for="search" class="pb-1">Search</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text">
                <i class="bi bi-search"></i>
              </span>
              <input type="text"
                     id="search"
                     class="form-control form-control-sm"
                     placeholder="Type to search table...">
            </div>
          </div>
          <div class="col-12 col-md-auto mt-2 mt-md-0">
            <button type="button"
                    id="sbButton"
                    data-bs-toggle="modal"
                    data-bs-target="#sbModal"
                    class="btn btn-sm bi bi-search icon-button btn-primary w-100 gap-1 search">Searchbuilder</button>
          </div>
        </div>
        <div class="row">
          <div class="table-responsive">
            <table class="table table-hover display nowrap" id="table">
              <thead>
                <tr>
                  <th class="all">Event</th>
                  <th class="all">Venue</th>
                  <th class="all">Set</th>
                  <th class="all">Song</th>
                  <th class="all">Note</th>
                </tr>
              </thead>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      let sb_columns = [0,1,2,3,4];

      var table = new DataTable('#table', {
        order: [0, 'asc'],
        ajax: {
          'url': '/api/v1/setlist_notes/?note={{ query }}&format=custom',
        },
        columnDefs: [
          { targets: '_all', className: 'text-wrap text-xs', defaultContent: '' },
        ],
        columns: [
          {
            'data': 'event',
            'name': 'event__event_id, event__early_late',
            'className': 'text-nowrap all',
            'width': '8rem',
            'type': 'text',
            'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return '<a href="/events/' + data.event_id + '">' + data.date.display + '</a>';
              }
            },
          },
          {
            'data': 'event.venue',
            'name': 'event__venue__name, event__venue__detail',
            'className': 'text-nowrap all',
            'width': '12rem',
            'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return '<a href="/venues/' + data.id + '">' + data.name + '</a>';
              }
            },
          },
          {
            'data': 'setlist.set_name',
            'name': 'setlist__set_name',
            'className': 'text-nowrap',
            'width': '8rem',
          },
          {
            'data': 'setlist.song',
            'name': 'setlist__song__name',
            'className': 'text-nowrap',
            'width': '12rem',
            'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return '<a href="/songs/' + data.id + '">' + data.name + '</a>';
              }
            },
          },
          {'data': 'note', 'name': 'note', 'className': 'text-wrap', 'width': '15rem'},
        ]
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
