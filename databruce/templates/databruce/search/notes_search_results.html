{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col">
    <div class="page-title">Setlist Notes Search</div>
    <div class="card mb-2">
      <div class="card-body">
        <div class="row d-flex gy-2 gy-md-0">
          <div class="prefix-container">
            <span class="prefix">Query</span>
            <span class="value">{{ query }}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-center align-items-center mt-3">
      <div class="col-12">
        <a class="btn btn-neutral text-sm w-100 collapse-toggle"
           id="filterCollapseToggle"
           data-bs-toggle="collapse"
           href="#filterCollapse"
           role="button"
           aria-expanded="false"
           aria-controls="filterCollapse">
          <span id="collapseText">Show Filters</span>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="16"
               height="16"
               fill="currentColor"
               class="bi bi-chevron-down collapse-icon"
               viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
          </svg>
        </a>
      </div>
    </div>
    <div class="collapse" id="filterCollapse">
      <div class="flex-column d-grid row-gap-2 pt-3 px-1">
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="search" class="form-label col-2 col-md-1 text-nowrap">Search:</label>
          <input type="text"
                 id="search"
                 class="form-control form-control-sm"
                 placeholder="Type to search table...">
        </div>
        <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label col-2 col-md-1 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off">
            <option value="0-asc" selected></option>
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body p-0">
        <div class="row">
          <div class="table-responsive">
            <table class="table table-hover display nowrap" id="table">
              <thead>
                <tr>
                  <th class="all">Event</th>
                  <th class="all">Venue</th>
                  <th class="all">Set</th>
                  <th class="all">Song</th>
                  <th class="all">Note</th>
                </tr>
              </thead>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      let sb_columns = [0, 1, 2, 3, 4];

      var table = new DataTable('#table', {
        order: [0, 'asc'],
        ajax: {
          'url': '/api/v1/setlist_notes/?note={{ query }}&format=custom',
        },
        columnDefs: [{
          targets: '_all',
          className: 'text-wrap text-xs',
          defaultContent: ''
        }, ],
        columns: [{
          'data': 'event',
          'name': 'event__event_id, event__early_late',
          'className': 'text-nowrap all',
          'width': '8rem',
          'type': 'text',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`;
            }
          },
        }, {
          'data': 'event.venue',
          'name': 'event__venue__name, event__venue__detail',
          'className': 'text-nowrap all',
          'width': '12rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/venues/${data.slug}">${data.name}</a>`
            }
          },
        }, {
          'data': 'set_name',
          'name': 'setlist__set_name',
          'className': 'text-nowrap',
          'width': '8rem',
        }, {
          'data': 'song',
          'name': 'setlist__song__name',
          'className': 'text-nowrap',
          'width': '12rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/songs/${data.slug}">${data.name}</a>`;
            }
          },
        }, {
          'data': 'note',
          'name': 'note',
          'className': 'text-wrap',
          'width': '15rem'
        }, ]
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
