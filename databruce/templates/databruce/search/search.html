{% extends "databruce/narrow_layout.html" %}
{% load static %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block extrajs %}
  <script src="{% static 'databruce/js/eventTable.js' %}"></script>
{% endblock extrajs %}
{% block content %}
  <div class="col-12">
    <div class="row">
      <div class="col">
        <div class="text-2xl text-nowrap mb-2">Event Search</div>
        <div class="card mb-2">
          <div class="card-body">
            <div class="row d-flex gy-2 gy-md-0">
              <div class="prefix-container">
                <span class="prefix">Event Date</span>
                <span class="value">{{ request.GET.date }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body">{% include "databruce/partials/event_table.html" %}</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      eventTable('/api/v1/events/?date={{ request.GET.date }}&format=custom');
    });
  </script>
{% endblock content %}
