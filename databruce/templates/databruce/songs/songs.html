{% extends "databruce/narrow_layout.html" %}
{% block title %}
  Songs
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Songs</div>
        <div class="text-base">Songs that Bruce has played live</div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <div class="row align-items-end d-flex row-gap-2 gx-1 mb-3">
              <div class="col-12 col-md-1">
                <label for="PublicityFilter" class="pb-1">Category</label>
                <select id="PublicityFilter" class="form-select form-select-sm">
                  <option value="">All</option>
                  <option value="true">Originals</option>
                  <option value="false">Covers</option>
                </select>
              </div>
              <!-- Search -->
              <div class="col">
                <label for="search" class="pb-1">Search</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>
                  <input type="text"
                         id="search"
                         class="form-control form-control-sm"
                         placeholder="Type to search table...">
                </div>
              </div>
              <div class="col-12 col-md-auto mt-2 mt-md-0">
                <button type="button"
                        id="sbButton"
                        data-bs-toggle="modal"
                        data-bs-target="#sbModal"
                        class="btn btn-sm bi bi-search icon-button btn-primary w-100 gap-1 search">
                  Searchbuilder
                </button>
              </div>
            </div>
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="songsTable">
                  <thead>
                    <tr class="custom">
                      <th class="all">Name</th>
                      <th class="all">Lyrics</th>
                      <th class="all">Orig. Artist</th>
                      <th class="all">Category</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                      <th class="all">Public</th>
                      <th class="all">Private</th>
                      <th class="all">Opener</th>
                      <th class="all">Closer</th>
                      <th class="all">Original</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  $(document).ready(function () {
    let sb_columns = [0,1,2,3,4,5,6,7,8];

    var table = new DataTable('#songsTable', {
      columnDefs: [
        { targets: '_all', defaultContent: '' },
        { targets: [1,6,7,8], width: "1rem", className: 'text-center' },
        { targets: [1], orderable: false, columnControl: [] },
      ],
      ajax: {
        'url': '/api/v1/songs/?format=custom',
      },
      columns: [
        {
          'data': 'name',
          'name': 'sort_song_name, name',
          'width': '20rem',
          'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return `<a class="text-wrap" href="/songs/${row.uuid}">${data}</a>`
              }
          },
        },
        {
          'data': 'has_lyrics',
          'name': 'has_lyrics',
          'searchable': false,
          'type': 'boolean',
          'width': '1rem',
          'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return data ? '<i class="bi bi-check-lg" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Has Lyrics"></i>'
              }
          },
        },
        {'data': 'original_artist', 'name': 'original_artist', 'width': '10rem' },
        {'data': 'category', 'name': 'category', 'className': 'text-wrap', 'width': '15rem'},
        {
          'data': 'first_event',
          'name': 'first_event__event_id, first_event__early_late',
          'width': '9rem',
          'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return `<a class="text-wrap" href="/events/${data.event_id}">${data.date.display}</a>`
              }
          },
        },
        {
          'data': 'last_event',
          'name': 'last_event__event_id, last_event__early_late',
          'width': '9rem',
          'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return `<a class="text-wrap" href="/events/${data.event_id}">${data.date.display}</a>`
              }
          },        
        },
        {'data': 'num_plays_public', 'name': 'num_plays_public', 'width': '1rem'},
        {'data': 'num_plays_private', 'name': 'num_plays_private', 'width': '1rem'},
        {'data': 'opener', 'name': 'opener', 'width': '1rem'},
        {'data': 'closer', 'name': 'closer', 'width': '1rem'},
        {'data': 'original', 'name': 'original', 'width': '1rem', 'visible': 'false', 'orderable': 'false'},
      ]
    });

    $('#PublicityFilter').on('change', function () {
      var selectedValue = this.value;
      table.column(10).search(selectedValue ? selectedValue : '', true, false).draw();
    });
    
    tableSearch(table, 'search');
    searchBuilder(table, sb_columns);
  });
  </script>
{% endblock content %}
