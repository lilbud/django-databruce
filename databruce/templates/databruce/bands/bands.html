{% extends "databruce/narrow_layout.html" %}
{% block title %}
    {{ title }}
{% endblock title %}
{% block content %}
    <div class="col-12">
        <div class="row mb-3">
            <div class="col">
                <div class="text-2xl">Bands</div>
                <div class="text-base">Bands that have shared a stage or appeared at an event with Bruce.</div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <div id="tableControls">
                            <div class="col-12 col-md-1">
                                <label for="PublicityFilter" class="pb-1">Category</label>
                                <select id="PublicityFilter" class="form-select form-select-sm">
                                    <option value="">All</option>
                                    <option value="true">w/Bruce</option>
                                    <option value="false">Guests</option>
                                </select>
                            </div>
                            <!-- Search -->
                            <div class="col">
                                <label for="search" class="pb-1">Search</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text"
                                           id="search"
                                           class="form-control form-control-sm"
                                           placeholder="Type to search table..." />
                                </div>
                            </div>
                            <div class="col-12 col-md-auto mt-2 mt-md-0">
                                <button type="button"
                                        id="sbButton"
                                        data-bs-toggle="modal"
                                        data-bs-target="#sbModal"
                                        class="btn btn-sm bi bi-search icon-button btn-primary w-100 gap-1 search">
                                    Searchbuilder
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="table-responsive">
                                <table class="table table-hover display" id="bandTable">
                                    <thead>
                                        <tr class="header">
                                            <th class="all text-center">Events</th>
                                            <th class="all">Name</th>
                                            <th class="all">First</th>
                                            <th class="all">Last</th>
                                            <th class="all">Bruce's Band?</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
  $(document).ready(function () {
    let sb_columns = [0, 1, 2, 3];

    var table = new DataTable("#bandTable", {
      columnDefs: [
        { target: -1, visible: false },
        { type: "num", targets: [0], width: "1rem" },
      ],
      order: [[1, "asc"]],
      ajax: {
        url: "/api/v1/bands/?format=custom",
      },
      columns: [
        { data: "num_events", name: "num_events", className: "dt-center" },
        {
          data: "name",
          name: "name",
          render: function (data, type, row, meta) {
            if (data) {
              return `<a href="/bands/${row.uuid}">${data}</a>`;
            }
          },
        },
        {
          data: "first_event",
          name: "first_event__event_id, first_event__early_late",
          render: function (data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`;
            }
          },
        },
        {
          data: "last_event",
          name: "last_event__event_id, last_event__early_late",
          render: function (data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`;
            }
          },
        },
        { data: "bruce_band", name: "bruce_band" },
      ],
    });

    $("#PublicityFilter").on("change", function () {
      var selectedValue = this.value;
      table
        .order([[0, "asc"]])
        .column(4)
        .search(selectedValue ? selectedValue : "", true, false)
        .draw();
    });

    tableSearch(table, "search");
    searchBuilder(table, sb_columns);
  });
    </script>
{% endblock content %}
