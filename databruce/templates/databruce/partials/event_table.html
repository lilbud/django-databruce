<div class="row align-items-end d-flex row-gap-2 gx-2 mb-3">
    <!-- Publicity Filter -->
    <div class="col-12 col-md-1">
        <label for="PublicityFilter" class="pb-1">Publicity</label>
        <select id="PublicityFilter" class="form-select form-select-sm">
            <option value="">All</option>
            <option value="true">Public</option>
            <option value="false">Private</option>
        </select>
    </div>
    <!-- Search -->
    <div class="col-12 col-md-11">
        <label for="search" class="pb-1">Search</label>
        <div class="input-group input-group-sm">
            <span class="input-group-text">
                <i class="bi bi-search"></i>
            </span>
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
        </div>
    </div>
</div>
<div class="row">
    <div class="table-responsive">
        <table class="table table-hover display nowrap" id="eventTable">
            <thead>
                <tr>
                    <th class="all">Date</th>
                    <th class="all">Setlist</th>
                    <th class="all">Band</th>
                    <th class="all">Venue</th>
                    <th class="all">Tour</th>
                    <th class="all">Detail</th>
                    <th class="all">Public</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
