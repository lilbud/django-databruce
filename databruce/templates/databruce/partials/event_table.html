<div class="col-12">
  {% comment %} <div class="d-none d-lg-flex flex-sm-row align-items-center justify-content-center column-gap-2 row-gap-2 flex-wrap">
    <div class="col-1 align-items-center justify-content-center gap-2">
      <label for="PublicityFilter" class="form-label col-2 col-lg-1 text-nowrap">Publicity:</label>
      <select id="PublicityFilter"
              class="form-select form-select-sm publicity-filter">
        <option value="">All</option>
        <option value="true">Public</option>
        <option value="false">Private</option>
      </select>
    </div>
    <div class="col align-items-center justify-content-center order-1 order-lg-2 gap-2"
         id="outerSearch">
      <label for="search" class="form-label col-2 col-lg-1 text-nowrap">Search</label>
      <input type="text"
             id="search"
             class="form-control form-control-sm"
             placeholder="Type to search table...">
    </div>
  </div> {% endcomment %}
  <div class="row justify-content-center align-items-center mt-3">
    <div class="col-12">
      <a class="btn btn-secondary text-sm w-100 collapse-toggle"
         id="filterCollapseToggle"
         data-bs-toggle="collapse"
         href="#filterCollapse"
         role="button"
         aria-expanded="false"
         aria-controls="filterCollapse">
        <span id="collapseText">Show Filters</span>
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16"
             height="16"
             fill="currentColor"
             class="bi bi-chevron-down collapse-icon"
             viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
        </svg>
      </a>
    </div>
  </div>
  <div class="collapse" id="filterCollapse">
    <div class="flex-column d-grid row-gap-2 py-3 px-1">
      <div class="col-12 d-flex align-items-center justify-content-center gap-2">
        <label for="search" class="form-label col-2 col-lg-1 text-nowrap">Search:</label>
        <input type="text"
               id="search"
               class="form-control form-control-sm"
               placeholder="Type to search table...">
      </div>
      <div class="col-12 d-flex align-items-center justify-content-center gap-2">
        <label for="PublicityFilter" class="form-label col-2 col-lg-1 text-nowrap">Publicity:</label>
        <select id="PublicityFilter"
                class="form-select form-select-sm publicity-filter">
          <option value="">All</option>
          <option value="true">Public</option>
          <option value="false">Private</option>
        </select>
      </div>
      <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
           id="dropdown-container">
        <label for="eventTableOrder" class="form-label col-2 col-lg-1 text-nowrap">Order By:</label>
        <select name=""
                id="eventTableOrder"
                class="form-select form-select-sm column-order"
                autocomplete="off">
          <option value="1-asc" selected>Date (asc.)</option>
          <option value="1-desc">Date (desc.)</option>
          <option value="3-asc">Band (A-Z)</option>
          <option value="3-desc">Band (Z-A)</option>
          <option value="4-asc">Venue (A-Z)</option>
          <option value="4-desc">Venue (Z-A)</option>
          <option value="5-asc">Tour (A-Z)</option>
          <option value="5-desc">Tour (Z-A)</option>
        </select>
      </div>
    </div>
  </div>
  <div class="row mt-4 mb-3">
    <div class="d-flex flex-column flex-lg-row align-items-center justify-content-center column-gap-3 flex-wrap event-controls"
         id="eventTableControls">
      <div class="order-1 mb-0">{% include "databruce/partials/table_pagination.html" %}</div>
      <div class="dt-info order-2 table_info"
           aria-live="polite"
           role="status"
           id="eventTableInfo"></div>
    </div>
  </div>
</div>
<div class="col-12">
  <div class="d-none d-lg-block" id="tableContainer">
    <div class="card">
      <div class="card-body p-0">
        <div class="row">
          <div class="table-responsive">
            <table class="table table-hover display nowrap" id="eventTable">
              <thead>
                <tr>
                  <th class="all">
                    <i class="bi bi-star-fill"></i>
                  </th>
                  <th class="all">Date</th>
                  <th class="all">Setlist</th>
                  <th class="all">Band</th>
                  <th class="all">Venue</th>
                  <th class="all">Tour</th>
                  <th class="min-desktop">Detail</th>
                  <th class="all">Public</th>
                </tr>
              </thead>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="cardContainer" class="d-block d-lg-none">
    <div class="row g-3" id="cards"></div>
  </div>
  <div class="mt-3 event-controls">
    <div class="d-flex justify-content-center mb-2 mb-lg-0 align-items-center gap-2 order-2 col-12 col-lg-auto">
      <button class="btn btn-sm btn-primary border-0 btn-prev"
              aria-label="Previous page">
        <i class="bi bi-chevron-left"></i>
      </button>
      <input type="text"
             class="form-control form-control-sm text-center page-input m-0"
             min="1"
             value="1">
      <span class="total-pages align-middle">of 1</span>
      <button class="btn btn-sm btn-primary border-0 btn-next"
              aria-label="Next page">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
<script>
  const myCollapse = document.getElementById('filterCollapse');
  const toggleBtn = document.getElementById('collapseText');

  myCollapse.addEventListener('show.bs.collapse', () => {
    toggleBtn.textContent = 'Hide Filters';
  });

  myCollapse.addEventListener('hide.bs.collapse', () => {
    toggleBtn.textContent = 'Show Filters';
  });
</script>
