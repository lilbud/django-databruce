<div id="tableControls">
    <!-- Publicity Filter -->
    <div class="col-12 col-md-1">
        <label for="PublicityFilter" class="pb-1">Publicity</label>
        <select id="PublicityFilter" class="form-select form-select-sm">
            <option value="">All</option>
            <option value="true">Public</option>
            <option value="false">Private</option>
        </select>
    </div>
    <!-- Search -->
    <div class="col">
        <label for="search" class="pb-1">Search</label>
        <div class="input-group input-group-sm">
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
        </div>
    </div>
</div>
<div class="row p-1">
    <div class="col-12 col-lg-2" id="dropdown-container">
        <label for="columnOrder" class="pb-1">Order By:</label>
        <select name=""
                id="columnOrder"
                class="form-select form-select-sm"
                autocomplete="off">
            <option value="0-asc" selected>Date (asc.)</option>
            <option value="0-desc">Date (desc.)</option>
            <option value="2-asc">Band (A-Z)</option>
            <option value="2-desc">Band (Z-A)</option>
            <option value="3-asc">Venue (A-Z)</option>
            <option value="3-desc">Venue (Z-A)</option>
            <option value="4-asc">Tour (A-Z)</option>
            <option value="4-desc">Tour (Z-A)</option>
        </select>
    </div>
</div>
<div class="row">
    <div class="table-responsive">
        <table class="table table-hover display nowrap" id="eventTable">
            <thead>
                <tr>
                    <th class="all">Date</th>
                    <th class="all">Setlist</th>
                    <th class="all">Band</th>
                    <th class="all">Venue</th>
                    <th class="all">Tour</th>
                    <th class="all">Detail</th>
                    <th class="all">Public</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
