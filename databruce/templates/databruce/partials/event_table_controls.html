<div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-2 row-gap-2 flex-wrap">
  <div class="col order-1 order-lg-2">
    <label for="search" class="pb-1">Search</label>
    <div class="input-group input-group-sm">
      <input type="text"
             id="search"
             class="form-control form-control-sm"
             placeholder="Type to search table...">
    </div>
  </div>
  <div class="col-12 col-lg-2 col-xl-1 order-2 order-lg-1">
    <label for="PublicityFilter" class="pb-1">Publicity</label>
    <select id="PublicityFilter"
            class="form-select form-select-sm publicity-filter">
      <option value="">All</option>
      <option value="true">Public</option>
      <option value="false">Private</option>
    </select>
  </div>
</div>
<div class="row my-3">
  <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
       id="controls">
    {% include "databruce/partials/table_pagination.html" %}
    <div class="dt-info order-3 table_info" aria-live="polite" role="status"></div>
    <div class="order-1 order-lg-3 d-flex col-12 col-lg-3 mb-3 mb-lg-0 align-items-center justify-content-center justify-content-sm-start gap-2"
         id="dropdown-container">
      <label for="columnOrder" class="form-label mb-0 text-nowrap">Order By:</label>
      <select name=""
              id="columnOrder"
              class="form-select form-select-sm column-order"
              autocomplete="off">
        <option value="1-asc" selected>Date (asc.)</option>
        <option value="1-desc">Date (desc.)</option>
        <option value="3-asc">Band (A-Z)</option>
        <option value="3-desc">Band (Z-A)</option>
        <option value="4-asc">Venue (A-Z)</option>
        <option value="4-desc">Venue (Z-A)</option>
        <option value="5-asc">Tour (A-Z)</option>
        <option value="5-desc">Tour (Z-A)</option>
      </select>
    </div>
  </div>
</div>
