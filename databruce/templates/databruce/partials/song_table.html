<div id="tableControls">
  <div class="col-12 col-md-1">
    <label for="categoryFilter" class="pb-1">Category</label>
    <select id="categoryFilter" class="form-select form-select-sm">
      <option value="">All</option>
      <option value="true">Original</option>
      <option value="false">Covers</option>
    </select>
  </div>
  <!-- Search -->
  <div class="col">
    <label for="song-search" class="pb-1">Search</label>
    <div class="input-group input-group-sm">
      <input type="text"
             id="song-search"
             class="form-control form-control-sm"
             placeholder="Type to search table...">
    </div>
  </div>
</div>
<div class="row">
  <div class="table-responsive">
    <table class="table table-hover display" id="songTable">
      <thead>
        <tr>
          <th class="all">Plays</th>
          <th class="all">Song</th>
          <th class="all">Category</th>
          <th class="all">First</th>
          <th class="all">Last</th>
          <th class="all">Original</th>
        </tr>
      </thead>
    </table>
  </div>
</div>
