<div class="justify-content-center align-items-center mt-3">
  <a class="btn btn-neutral text-sm w-100 collapse-toggle"
     id="songCollapseToggle"
     data-bs-toggle="collapse"
     href="#songCollapse"
     role="button"
     aria-expanded="false"
     aria-controls="songCollapse">
    <span id="collapseText">Show Filters</span>
    <svg xmlns="http://www.w3.org/2000/svg"
         width="16"
         height="16"
         fill="currentColor"
         class="bi bi-chevron-down collapse-icon"
         viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
    </svg>
  </a>
</div>
<div class="collapse" id="songCollapse">
  <div class="flex-column d-grid row-gap-2 pt-3 px-1">
    <div class="col-12 d-flex align-items-center justify-content-center gap-2">
      <label for="search" class="form-label col-2 col-md-1 text-nowrap">Search</label>
      <input type="text"
             id="songSearch"
             class="form-control form-control-sm"
             placeholder="Type to search table...">
    </div>
    <div class="col-12 d-flex align-items-center justify-content-center gap-2">
      <label for="categoryFilter" class="form-label col-2 col-md-1 text-nowrap">Category</label>
      <select id="categoryFilter" class="form-select form-select-sm">
        <option value="">All</option>
        <option value="true">Original</option>
        <option value="false">Covers</option>
      </select>
    </div>
    <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
         id="dropdown-container">
      <label for="songTableOrder" class="form-label col-2 col-md-1 text-nowrap">Order By:</label>
      <select name=""
              id="songTableOrder"
              class="form-select form-select-sm column-order"
              autocomplete="off">
        <option value="1-asc" selected>Date (asc.)</option>
        <option value="1-desc">Date (desc.)</option>
        <option value="3-asc">Band (A-Z)</option>
        <option value="3-desc">Band (Z-A)</option>
        <option value="4-asc">Venue (A-Z)</option>
        <option value="4-desc">Venue (Z-A)</option>
        <option value="5-asc">Tour (A-Z)</option>
        <option value="5-desc">Tour (Z-A)</option>
      </select>
    </div>
  </div>
</div>
<div class="row my-3">
  <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap song-controls"
       id="songTableControls">
    {% include "databruce/partials/table_pagination.html" %}
    <div class="dt-info order-3"
         aria-live="polite"
         role="status"
         id="songTableInfo"></div>
  </div>
</div>
<div class="card">
  <div class="card-body p-0">
    <div class="row">
      <div class="table-responsive">
        <table class="table table-hover display" id="songTable">
          <thead>
            <tr>
              <th class="all">Plays</th>
              <th class="all">Song</th>
              <th class="all">Category</th>
              <th class="all">First</th>
              <th class="all">Last</th>
              <th class="all">Original</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="mt-3 song-controls">
  <div class="d-flex justify-content-center mb-2 mb-lg-0 align-items-center gap-2 order-2 col-12 col-lg-auto">
    <button class="btn btn-sm btn-primary border-0 btn-prev"
            aria-label="Previous page">
      <i class="bi bi-chevron-left"></i>
    </button>
    <input type="text"
           class="form-control form-control-sm text-center page-input m-0"
           min="1"
           value="1">
    <span class="total-pages align-middle">of 1</span>
    <button class="btn btn-sm btn-primary border-0 btn-next"
            aria-label="Next page">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
