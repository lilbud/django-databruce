<div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-2 row-gap-2 flex-wrap">
  <div class="col order-1 order-lg-2">
    <label for="slotSearch" class="pb-1">Search</label>
    <div class="input-group input-group-sm">
      <input type="text"
             id="slotSearch"
             class="form-control form-control-sm"
             placeholder="Type to search table...">
    </div>
  </div>
</div>
<div class="row my-3">
  <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
       id="slotTableControls">
    {% comment %} {% include "databruce/partials/table_pagination.html" %} {% endcomment %}
    <div class="dt-info order-3"
         aria-live="polite"
         role="status"
         id="slotTableInfo"></div>
    <div class="order-1 order-lg-3 d-flex col-12 col-lg-3 mb-3 mb-lg-0 align-items-center justify-content-center justify-content-sm-start gap-2"
         id="dropdown-container">
      <label for="slotTableOrder" class="form-label mb-0 text-nowrap">Order By:</label>
      <select name=""
              id="slotTableOrder"
              class="form-select form-select-sm column-order"
              autocomplete="off">
        <option value="1-asc" selected>Date (asc.)</option>
        <option value="1-desc">Date (desc.)</option>
        <option value="3-asc">Band (A-Z)</option>
        <option value="3-desc">Band (Z-A)</option>
        <option value="4-asc">Venue (A-Z)</option>
        <option value="4-desc">Venue (Z-A)</option>
        <option value="5-asc">Tour (A-Z)</option>
        <option value="5-desc">Tour (Z-A)</option>
      </select>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-body p-0">
    <div class="row">
      <div class="table-responsive">
        <table class="table table-hover display" id="slotTable">
          <thead>
            <tr>
              <th class="text-nowrap all">Event</th>
              <th class="text-nowrap all set show-opener">Show Opener</th>
              <th class="text-nowrap all set set-1-closer">Set 1 Closer</th>
              <th class="text-nowrap all set set-2-opener">Set 2 Opener</th>
              <th class="text-nowrap all set main-set-closer">Main Set Closer</th>
              <th class="text-nowrap all set encore-opener">Encore Opener</th>
              <th class="text-nowrap all set show-closer">Show Closer</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>
</div>
