{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Countries</div>
        <div class="text-base">Countries that Bruce has played in</div>
      </div>
    </div>
    {% include "databruce/partials/table_controls.html" %}
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="countryTable">
                  <thead>
                    <tr>
                      <th class="all">Events</th>
                      <th class="all">Name</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      let sb_columns = [0, 1, 2, 3];

      var table = new DataTable('#countryTable', {
        ajax: {
          'url': '/api/v1/countries/?format=custom',
        },
        columnDefs: [{
          width: '1rem',
          targets: [0]
        }, ],
        order: [
          [1, 'asc']
        ],
        columns: [{
          'data': 'num_events',
          'name': 'num_events'
        }, {
          'data': 'name',
          'name': 'name',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/countries/${row.uuid}">${row.name}</a>`;
            }
          },
        }, {
          'data': 'first_event',
          'name': 'first_event__event_id',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`
            }
          },
        }, {
          'data': 'last_event',
          'name': 'last_event__event_id',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`
            }
          },
        }, ]
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
