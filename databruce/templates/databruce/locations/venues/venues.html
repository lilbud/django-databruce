{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Venues</div>
        <div class="text-base">Venues that Bruce has played at</div>
      </div>
    </div>
    {% include "databruce/partials/table_controls.html" %}
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="venueTable">
                  <thead>
                    <tr>
                      <th class="text-center all">Events</th>
                      <th class="all">Name</th>
                      <th class="all">City</th>
                      <th class="all">State</th>
                      <th class="all">Country</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {

      let sb_columns = [0, 1, 2, 3, 4, 5, 6];

      var table = new DataTable('#venueTable', {
        ajax: {
          'url': '/api/v1/venues/?format=custom',
        },
        columnDefs: [{
          'targets': [0],
          'width': '1rem'
        }, {
          'targets': '_all',
          'className': 'text-wrap',
          defaultContent: ''
        }, ],
        order: [
          [1, 'asc']
        ],
        columns: [{
          'data': 'num_events',
          'name': 'num_events'
        }, {
          'data': 'name',
          'name': 'name, detail',
          'width': '12rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return '<a href="/venues/' + row.uuid + '">' + data + '</a>';
            }
          },
        }, {
          'data': 'city',
          'name': 'city__name, city__aliases',
          'width': '10rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return '<a href="/cities/' + data.uuid + '">' + data.name + '</a>';
            }
          },
        }, {
          'data': 'state',
          'name': 'city__state__name, city__state__abbrev',
          'width': '8rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return '<a href="/states/' + data.uuid + '">' + data.name + '</a>';
            }
          },
        }, {
          'data': 'country',
          'name': 'city__country__name, city__country__alpha_2',
          'width': '10rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return '<a href="/countries/' + data.uuid + '">' + data.name + '</a>';
            }
          },
        }, {
          'data': 'first_event',
          'name': 'first_event__event_id, first_event__early_late',
          'width': '8rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`
            }
          },
        }, {
          'data': 'last_event',
          'name': 'last_event__event_id, last_event__early_late',
          'width': '8rem',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/events/${data.event_id}">${data.date}</a>`
            }
          },
        }, ],
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
