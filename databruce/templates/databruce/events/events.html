{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row">
      <div class="col">
        <div class="d-flex justify-content-start mb-3">
          <div class="text-2xl pe-2">Events</div>
          <div id="year-select" class="pe-2">
            <button class="btn btn-sm btn-primary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">{{ year }}</button>
            <ul class="dropdown-menu">
              {% for i in years %}
                <li>
                  <a class="dropdown-item" href="{% url "events_year" year=i %}">{{ i }}</a>
                </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Filter Events</h5>
              <button type="button"
                      id="btnResetAll"
                      class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
              </button>
            </div>
            <div class="row align-items-center d-flex row-gap-2 gx-2">
              <!-- Text Search Input -->
              <div class="col-6 col-md-1">
                <label for="privacyFilter" class="pb-1">Filter Public</label>
                <select id="privacyFilter" class="form-select form-select-sm">
                  <option value="">All</option>
                  <option value="true">Public</option>
                  <option value="false">Private</option>
                </select>
              </div>
              <!-- row count -->
              <div class="col-6 col-md-1">
                <label class="pb-1" for="customLengthMenu">Show</label>
                <select id="customLengthMenu" class="form-select form-select-sm">
                  <option value="25">25</option>
                  <option value="50">50</option>
                  <option value="100" selected>100</option>
                </select>
              </div>
              <!-- Search -->
              <div class="col">
                <label for="customSearchInput" class="pb-1">Search</label>
                <input type="text"
                       id="customSearchInput"
                       class="form-control form-control-sm"
                       placeholder="Type to search table...">
              </div>
            </div>
            <div class="accordion" id="advancedFilterAccordion">
              <div class="accordion-item border-0">
                <div class="pt-4">
                  <a class="text-decoration-none fw-semibold d-inline-flex align-items-center gap-1 text-sm collapsed custom-accordion-toggle"
                     href="#"
                     data-bs-toggle="collapse"
                     data-bs-target="#collapseAdvanced"
                     aria-expanded="false"
                     aria-controls="collapseAdvanced">
                    <span id="accordionToggleText">Show Advanced Filters</span>
                    <i class="bi bi-chevron-down toggle-arrow transition-transform"></i>
                  </a>
                </div>
                <div id="collapseAdvanced"
                     class="accordion-collapse collapse"
                     aria-labelledby="headingAdvanced"
                     data-bs-parent="#advancedFilterAccordion">
                  <div class="accordion-body px-0 pt-3 pb-0">
                    <!-- SearchBuilder UI will be dynamically injected here -->
                    <div id="searchBuilderContainer"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body px-0 pt-0">
            <div class="table-responsive">
              <table class="table table-hover display nowrap" id="eventTable">
                <thead>
                  <tr>
                    <th class="all">Date</th>
                    <th class="all">Setlist</th>
                    <th class="all">Band</th>
                    <th class="all">Venue</th>
                    <th class="all">Tour</th>
                    <th class="all">Detail</th>
                    <th class="all">Public</th>
                  </tr>
                </thead>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  $(document).ready(function () {
    var layout = getDatatableLayout({columns: [1,2,3,4,5,6,7], category: false});
  
    $('.custom-accordion-toggle').on('click', function(e) {
        e.preventDefault();
    });

    // Listen for the Advanced Accordion panel to expand
    $('#collapseAdvanced').on('show.bs.collapse', function () {
        $('#accordionToggleText').text('Hide Advanced Filters');
    });

    // Listen for the Advanced Accordion panel to collapse
    $('#collapseAdvanced').on('hide.bs.collapse', function () {
        $('#accordionToggleText').text('Show Advanced Filters');
    });

    var table = new DataTable('#eventTable', {
      layout: {
        topStart: null,
        topEnd: null,
      },
      fixedHeader: {
        header: true,
      },
      ajax: {
        'url': '/api/v1/events/?year={{ year }}&format=custom',
      },

      columns: event_table_columns,
    });

    new DataTable.SearchBuilder(table, {
        liveSearch: false,
        depthLimit: 1,
    });

    var container = table.searchBuilder.container();
    $('#searchBuilderContainer').append(container);

    $('#customSearchInput').on('keyup change clear', function() {
        table.search(this.value).draw();
    });

    $('#privacyFilter').on('change', function() {
        var selectedValue = this.value;
        
        table.column(6)
             .search(selectedValue ? '^' + selectedValue + '$' : '', true, false)
             .draw();
    });

    $('#customLengthMenu').on('change', function() {
        var length = parseInt(this.value, 10);
        table.page.len(length).draw();
    });

    $('#btnResetAll').on('click', function() {
        // Clear HTML Input fields & reset selection elements back to initial choices
        $('#customSearchInput').val('');
        $('#privacyFilter').val('');
        $('#customLengthMenu').val('25');

        // Flush DataTables state tracking
        table.search('');
        table.column(2).search('');
        table.page.len(25);
        table.order([[0, 'asc']]);

        // Destroys and clears all current condition trees inside the active SearchBuilder instance
        table.searchBuilder.rebuild(); 

        // Collapse the accordion view smoothly if it's currently open
        var advancedAccordion = document.getElementById('collapseAdvanced');
        if (advancedAccordion.classList.contains('show')) {
            var bsCollapse = bootstrap.Collapse.getInstance(advancedAccordion) || new bootstrap.Collapse(advancedAccordion);
            bsCollapse.hide();
        }

        // Finalize state modifications and re-render pristine data matrix
        table.draw();
    });

    $(function(){
      // bind change event to select
      $('#year_select').on('change', function () {
          var url = $(this).val() // get selected value
          if (url) { // require a URL
              window.location = url; // redirect
          }
          return false;
      });
    });
  });
  </script>
{% endblock content %}
