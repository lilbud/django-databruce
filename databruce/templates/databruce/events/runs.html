{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Event Runs</div>
        <div class="text-base">A 'run' is multiple events at the same venue by the same band, usually consecutive.</div>
      </div>
    </div>
    <div class="row">
      <div id="tableControls">
        <!-- Search -->
        <div class="col">
          <label for="search" class="pb-1">Search</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
          </div>
        </div>
      </div>
    </div>
    <div class="my-3">
      <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
           id="controls">
        <div class="dt-info order-3 table_info" aria-live="polite" role="status"></div>
        <div class="order-1 order-lg-3 d-flex col-12 col-lg-3 mb-3 mb-lg-0 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label mb-0 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off"></select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="runTable">
                  <thead>
                    <tr>
                      <th class="all">Name</th>
                      <th class="min-desktop">Band</th>
                      <th class="min-desktop">Venue</th>
                      <th class="all">Events</th>
                      <th class="min-desktop">Songs</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      var sb_columns = [1, 2, 3, 4, 5, 6, 7, 8];

      var table = new DataTable('#runTable', {
        ajax: {
          'url': '/api/v1/runs/?format=custom',
        },
        order: [
          [6, 'desc']
        ],
        responsive: {
          details: false,
        },
        columns: [{
          'data': 'name',
          'name': 'name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/runs/${row.slug}">${row.name}</a>` : '';
          },
        }, {
          'data': 'band',
          'name': 'band__name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/bands/${data.uuid}">${data.name}</a>` : '';
          },
        }, {
          'data': 'venue',
          'name': 'venue__name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/venues/${data.uuid}">${data.name}</a><br><small>${row.city}</small>` : '';
          },
        }, {
          'data': 'num_events',
          'name': 'num_events',
          'width': '1rem'
        }, {
          'data': 'num_songs',
          'name': 'num_songs',
          'width': '1rem'
        }, {
          'data': 'first_event',
          'name': 'first_event__event_id, first_event__early_late',

          'type': 'date',
          'render': function(data, type, row, meta) {
            return eventDateFormat(data);
          },
        }, {
          'data': 'last_event',
          'name': 'last_event__event_id, last_event__early_late',

          'type': 'date',
          'render': function(data, type, row, meta) {
            return eventDateFormat(data);
          },
        }],
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
