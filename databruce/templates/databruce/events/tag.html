{% extends "databruce/narrow_layout.html" %}
{% load static %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block extrajs %}
  <script src="{% static 'databruce/js/eventTable.js' %}"></script>
{% endblock extrajs %}
{% block content %}
  <div class="col-12">
    <div class="row">
      <div class="col">
        <div class="d-flex flex-wrap justify-content-between row-gap-2">
          <div class="text-2xl">Events by Tag</div>
          <div id="tag-select" class="col-12 col-lg-auto">
            <select onchange="location = this.value;"
                    class="form-select form-select-sm tag-filter">
              {% for i in tags %}
                <option value="{% url "events_by_tag" slug=i.slug %}"
                        {% if i.name == tag.name %}selected{% endif %}>{{ i.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="row my-3">
      <div class="col">
        <div class="prefix-container">
          <span class="prefix">Description</span>
          <span class="value">{{ tag.description }}</span>
        </div>
      </div>
    </div>
    <hr>
    {% include "databruce/partials/event_table.html" %}
  </div>
  <script>
    $(document).ready(function() {
      eventTable('/api/v1/events/?tag={{ tag.id }}&format=custom');

      $(function() {
        // bind change event to select
        $('#type_select').on('change', function() {
          var url = $(this).val() // get selected value
          if (url) { // require a URL
            window.location = url; // redirect
          }
          return false;
        });
      });
    });
  </script>
{% endblock content %}
