{% extends "databruce/narrow_layout.html" %}
{% block title %}
  Tour Legs
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Tour Legs</div>
      </div>
    </div>
    <div class="row">
      <div id="tableControls">
        <!-- Search -->
        <div class="col">
          <label for="search" class="pb-1">Search</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
          </div>
        </div>
      </div>
    </div>
    <div class="my-3">
      <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
           id="controls">
        <div class="dt-info order-3 table_info" aria-live="polite" role="status"></div>
        <div class="order-1 order-lg-3 d-flex col-12 col-lg-3 mb-3 mb-lg-0 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label mb-0 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off"></select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="tourLegTable">
                  <thead>
                    <tr>
                      <th class="all">Name</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                      <th class="all">Shows</th>
                      <th class="min-desktop">Songs</th>
                      <th class="min-desktop">Note</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      var table = new DataTable('#tourLegTable', {
        ajax: {
          'url': '/api/v1/tour_legs/?format=custom',
        },
        responsive: {
          details: false,
        },
        pageLength: -1,
        order: [
          [3, 'desc']
        ],
        columns: [{
          'data': 'name',
          'name': 'name',
          'render': function(data, type, row, meta) {
            if (data) {
              return `<a href="/tour_legs/${row.uuid}">${data}</a><br><small>${row.tour.name}</small>`;
            }
          },
        }, {
          'data': 'first_event',
          'name': 'first_event__event_id, first_event__early_late',
          'type': 'date',
          'render': function(data, type, row, meta) {
            return eventDateFormat(data);
          },
        }, {
          'data': 'last_event',
          'name': 'last_event__event_id, last_event__early_late',
          'type': 'date',
          'render': function(data, type, row, meta) {
            return eventDateFormat(data);
          },
        }, {
          'data': 'num_events',
          'name': 'num_events',
          'type': 'num',
          'width': '1rem',
          'className': 'text-center'
        }, {
          'data': 'num_songs',
          'name': 'num_songs',
          'type': 'num',
          'width': '1rem',
          'className': 'text-center'
        }, {
          'data': 'note',
          'name': 'note',
        }, ],
        initComplete: function(settings, json) {
          let api = this.api();
          let select = $('#columnOrder');

          select.empty();

          api.columns().every(function(index) {
            let column = this;

            if (column.orderable()) {
              let headerText = $(column.header()).text().trim();

              // 1. Safely retrieve DataTables' detected data type for this column
              // Accounts for both modern DataTables 2.0+ and legacy DataTables 1.x environments
              let type = typeof column.type === 'function' ?
                column.type() :
                settings.aoColumns[index].sType;

              // 2. Set fallback default text labels (Text / Strings)
              let ascLabel = '(A-Z)';
              let descLabel = '(Z-A)';

              // 3. Dynamically adjust labels based on the detected type
              if (type && (type.indexOf('num') !== -1)) {
                // Triggers for 'num', 'num-fmt', 'html-num', etc.
                ascLabel = '(Least)';
                descLabel = '(Most)';
              } else if (type && (type.indexOf('date') !== -1)) {
                // Triggers for 'date' or custom registered date-time formats
                ascLabel = '(asc.)';
                descLabel = '(desc.)';
              }

              // Append the options using the index-direction value format
              select.append(`<option value="${index}-asc">${headerText} ${ascLabel}</option>`);
              select.append(`<option value="${index}-desc">${headerText} ${descLabel}</option>`);
            }
          });

          select.on('change', function() {
            let val = $(this).val();
            if (val) {
              let parts = val.split('-');
              let columnIndex = parseInt(parts[0], 10);
              let direction = parts[1];

              api.order([columnIndex, direction]).draw();
            }
          });

          api.on('order.dt', function() {
            // Get current ordering array: e.g., [[0, 'asc']]
            let currentOrder = api.order();

            if (currentOrder.length > 0) {
              let currentColumnIndex = currentOrder[0][0];
              let currentDirection = currentOrder[0][1];

              // Reconstruct the expected value string (e.g., "0-asc")
              let targetValue = `${currentColumnIndex}-${currentDirection}`;

              // Update the dropdown value to match without triggering its change event
              select.val(targetValue);
            }
          });

          // Run an initial sync to match whatever default order the table loaded with
          let initialOrder = api.order();
          if (initialOrder.length > 0) {
            select.val(`${initialOrder[0][0]}-${initialOrder[0][1]}`);
          }
        }
      });

      tableSearch(table, 'search');
    });
  </script>
{% endblock content %}
