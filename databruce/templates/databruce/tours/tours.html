{% extends "databruce/narrow_layout.html" %}
{% block title %}
  Tours
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Tours</div>
      </div>
    </div>
    <div class="row justify-content-center align-items-center mt-3">
      <div class="col-12">
        <a class="btn btn-neutral text-sm w-100 collapse-toggle"
           id="filterCollapseToggle"
           data-bs-toggle="collapse"
           href="#filterCollapse"
           role="button"
           aria-expanded="false"
           aria-controls="filterCollapse">
          <span id="collapseText">Show Filters</span>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="16"
               height="16"
               fill="currentColor"
               class="bi bi-chevron-down collapse-icon"
               viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
          </svg>
        </a>
      </div>
    </div>
    <div class="collapse" id="filterCollapse">
      <div class="flex-column d-grid row-gap-2 pt-3 px-1">
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="search" class="form-label col-2 col-md-1 text-nowrap">Search:</label>
          <input type="text"
                 id="search"
                 class="form-control form-control-sm"
                 placeholder="Type to search table...">
        </div>
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="PublicityFilter" class="form-label col-2 col-md-1 text-nowrap">
            <span data-bs-toggle="tooltip"
                  class="text-decoration-underline"
                  data-bs-html="true"
                  data-bs-title="Miscellaneous tours are for events that don't belong to a proper Tour.<br>One has been made for each year rather than a 'Non-Tour Events' tour.">
              Show Misc. Tours
            </span>
          </label>
          <select id="PublicityFilter"
                  class="form-select form-select-sm publicity-filter">
            <option value="^.*$">Show</option>
            <option value="^(?!.*Misc).*$">Hide</option>
          </select>
        </div>
        <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label col-2 col-md-1 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off">
            <option value="0-asc" selected></option>
          </select>
        </div>
      </div>
    </div>
    <div class="row mt-4 mb-3">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="tourTable">
                  <thead>
                    <tr class="header">
                      <th class="all">Name</th>
                      <th class="min-desktop">Band</th>
                      <th class="all">First</th>
                      <th class="all">Last</th>
                      <th class="all">Shows</th>
                      <th class="all">Songs</th>
                      <th class="min-desktop">Legs</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      let sb_columns = [1, 2, 3, 4, 5, 6];

      var table = new DataTable('#tourTable', {
        ajax: {
          'url': '/api/v1/tours/?format=custom',
        },
        pageLength: -1,
        columnDefs: [{
          targets: [4, 5, 6],
          width: '1rem',
          className: 'dt-center'
        }, {
          targets: [1],
          width: '12rem'
        }, ],
        order: [
          [3, 'desc']
        ],
        responsive: {
          details: false,
        },
        columns: [{
          'data': 'name',
          'name': 'name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/tours/${row.slug}">${data}</a>` : '';
          },
        }, {
          'data': 'band',
          'name': 'band__name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/bands/${data.uuid}">${data.name}</a>` : '';
          },
        }, {
          'data': 'first_event',
          'name': 'first_event__event_id, first_event__early_late',
          'type': 'date',
          'render': function(data, type, row, meta) {
            return eventDateFormat(data)
          },
        }, {
          'data': 'last_event',
          'name': 'last_event__event_id, last_event__early_late',
          'type': 'date',
          'render': function(data, type, row, meta) {
            if (data) {
              return eventDateFormat(data)
            }
          },
        }, {
          'data': 'num_events',
          'name': 'num_events'
        }, {
          'data': 'num_songs',
          'name': 'num_songs'
        }, {
          'data': 'num_legs',
          'name': 'num_legs'
        }],
      });

      $('#PublicityFilter').on('change', function() {
        var selectedValue = this.value;
        table.order([
          [3, 'desc']
        ]).column(0).search(selectedValue ? selectedValue : '', true, false).draw();
      });

      // 3. Listen for dropdown changes to reorder the table
      $('.column-order').on('change', function() {
        let rawValue = $(this).val();

        // Don't trigger sorting if the default placeholder option is selected
        if (!rawValue) return;

        // Split the combined string value (e.g., "2-desc" becomes index 2, direction "desc")
        let parts = rawValue.split('-');
        let selectedColumnIndex = parseInt(parts[0], 10);
        let direction = parts[1];

        // Apply ordering rule and refresh interface layout
        table.order([selectedColumnIndex, direction]).draw();
      });

      tableSearch(table, 'search');
      searchBuilder(table, sb_columns);
    });
  </script>
{% endblock content %}
