{% extends "databruce/wide_layout.html" %}
{% block extrajs %}
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@7.1.0/all/global.js'></script>
  <!-- THEME JS -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.1.0/global.js"></script>
  <!-- STYLESHEETS -->
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css'
        rel='stylesheet' />
  <link href='https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.1.0/theme.css'
        rel='stylesheet' />
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        validRange: {
          start: '1965-06-01',
          end: '{{ end_date }}',
        },
        datesSet: function(dateInfo) {
          // Get the start date string (e.g., '2026-10-01')
          const startParam = dateInfo.startStr.split('T')[0];

          // Build a new URL with the start parameter
          const newUrl = new URL(window.location);
          newUrl.searchParams.set('start', startParam);

          // Update browser history without reloading the page
          window.history.pushState({}, '', newUrl);
        },
        fixedWeekCount: false,
        initialDate: '{{ start_date }}',
        schedulerLicenseKey: 'CC-Attribution-NonCommercial-NoDerivatives',
        dayMinWidth: 85,
        height: 768,
        dayMaxEventRows: true,
        contentHeight: 768,
        headerToolbar: {
          start: 'title',
          center: '',
          end: 'prev,next'
        },
        eventSources: [
          // events
          function(info, successCallback, failureCallback) {
            fetch(`/api/v1/events/?format=json&start_date=${info.start.toISOString()}&end_date=${info.end.toISOString()}`)
              .then((resp) => resp.json())
              .then(function(data) {
                var eventsList = [];

                data.results.forEach((item, index) => {
                  var title = `${item.artist.name}: ${item.venue.name}`

                  if (item.early_late) {
                    title += ` (${item.early_late})`
                  }

                  if (item.type) {
                    title += ` [${item.type[0]['name']}]`
                  }

                  eventsList.push({
                    title: title,
                    start: item.date,
                    url: `/events/${item.event_id}`,
                    allDay: false,
                    className: 'calendar event show px-1'
                  })
                });

                successCallback(eventsList);
              })
          },
          // event runs
          function(info, successCallback, failureCallback) {
            fetch(`/api/v1/runs/?format=json&start_date=${info.start.toISOString()}&end_date=${info.end.toISOString()}`)
              .then((resp) => resp.json())
              .then(function(data) {
                var eventsList = [];

                data.results.forEach((item, index) => {
                  eventsList.push({
                    title: item.name,
                    start: item.first_event.date,
                    end: `${item.last_event.date}T23:59:59`,
                    url: `/runs/${item.slug}`,
                    className: 'px-1 calendar event-run',
                  })
                })

                successCallback(eventsList);
              })
          },
          // releases (current year)
          function(info, successCallback, failureCallback) {
            fetch(`/api/v1/releases/?format=json&start_date=${info.startStr}&end_date=${info.endStr}&current_year=true`)
              .then((resp) => resp.json())
              .then(function(data) {
                var eventsList = [];

                data.results.forEach((item, index) => {
                  let releaseDate = new Date(item.date);
                  eventsList.push({
                    title: `${item.name}`,
                    start: item.date,
                    url: `/releases/${item.uuid}`,
                    className: 'px-1 calendar release-event',
                  })
                })

                successCallback(eventsList);
              })
          },
          // releases historical
          function(info, successCallback, failureCallback) {
            const midTime = info.start.getTime() + (info.end.getTime() - info.start.getTime()) / 2;
            const midDate = new Date(midTime);

            const targetMonth = midDate.getMonth() + 1;
            const currentViewYear = midDate.getFullYear();

            fetch(`/api/v1/releases/?format=json&month=${targetMonth}&current_year=false`)
              .then((resp) => resp.json())
              .then(function(data) {
                var eventsList = [];
                const currentViewYear = info.start.getFullYear();

                data.results.forEach((item, index) => {
                  let historicalDate = new Date(item.date);
                  let releaseDate = new Date(item.date);
                  historicalDate.setFullYear(currentViewYear);

                  eventsList.push({
                    title: `${item.name} (${releaseDate.getFullYear()})`,
                    start: historicalDate.toISOString().split('T')[0],
                    url: `/releases/${item.uuid}`,
                    className: 'px-1 calendar release-event-past',
                  })
                })

                successCallback(eventsList);
              })
          },
          // relation birthdays
          function(info, successCallback, failureCallback) {
            fetch(`/api/v1/relations/?format=json&month=${info.start.getMonth() + 2}&show_cal=true`)
              .then((resp) => resp.json())
              .then(function(data) {
                var eventsList = [];
                const currentViewYear = info.start.getFullYear();

                data.results.forEach((item, index) => {
                  let historicalDate = new Date(item.start_date);
                  let birthYear = historicalDate.getUTCFullYear();
                  historicalDate.setFullYear(currentViewYear);

                  eventsList.push({
                    title: `${item.name} (${birthYear})`,
                    start: historicalDate.toISOString().split('T')[0],
                    className: 'px-1 calendar event-birthday',
                  })
                })

                successCallback(eventsList);
              })
          },
        ],
        eventClick: function(info) {
          // Check if the event has a URL
          if (info.event.url) {
            // Open the URL in a new tab
            window.open(info.event.url, '_blank');
            // Prevent the browser from navigating in the current tab
            info.jsEvent.preventDefault();
          }
        },
        eventContent: function(info) {
          return {
            html: info.event.title
          };
        }
      });
      calendar.render();

    });
  </script>
{% endblock extrajs %}
{% load static %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12 col-xl-10">
    <div class="row">
      <div class="col">
        <div class="d-flex flex-wrap justify-content-between row-gap-2 mb-3">
          <div class="text-2xl">Event Calendar</div>
          <div id="year-select" class="col-12 col-lg-auto">
            <select id="yearSelect"
                    onchange="location = this.value;"
                    class="form-select form-select-sm year-filter">
              {% for i in years %}
                <option value="{% url "calendar" %}?start={{ i }}-01"
                        {% if i == year %}selected{% endif %}>{{ i }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div id="calendar"></div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      var date = new Date();

      let currentMonth = (date.getMonth() + 1).toString().padStart(2, "0");
      let currentDay = date.getDate().toString().padStart(2, "0");

      $(`td[data-date$='${currentMonth}-${currentDay}']`).addClass('today');
    });
  </script>
{% endblock content %}
