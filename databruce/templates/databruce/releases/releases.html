{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Releases</div>
        <div class="text-base">Various retail releases that Bruce appears on.</div>
      </div>
    </div>
    <div class="row justify-content-center align-items-center mt-3">
      <div class="col-12">
        <a class="btn btn-neutral text-sm w-100 collapse-toggle"
           id="filterCollapseToggle"
           data-bs-toggle="collapse"
           href="#filterCollapse"
           role="button"
           aria-expanded="false"
           aria-controls="filterCollapse">
          <span id="collapseText">Show Filters</span>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="16"
               height="16"
               fill="currentColor"
               class="bi bi-chevron-down collapse-icon"
               viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
          </svg>
        </a>
      </div>
    </div>
    <div class="collapse" id="filterCollapse">
      <div class="flex-column d-grid row-gap-2 pt-3 px-1">
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="search" class="form-label col-2 col-md-1 text-nowrap">Search</label>
          <div class="input-group input-group-sm">
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
          </div>
        </div>
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="PublicityFilter" class="form-label col-2 col-md-1">Category</label>
          <select id="PublicityFilter"
                  class="form-select form-select-sm publicity-filter">
            <option value="">All</option>
            {% for item in categories %}
              <option value="{{ item.0 }}">{{ item.1 }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label col-2 col-md-1 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off">
            <option value="0-asc" selected></option>
          </select>
        </div>
      </div>
    </div>
    <div class="row my-3">
      <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
           id="controls">
        <div class="dt-info order-3"
             aria-live="polite"
             role="status"
             id="tableInfo"></div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="releasesTable">
                  <thead>
                    <tr class="header">
                      <th class="all">Name</th>
                      <th class="min-tablet-l">Date</th>
                      <th class="all">Type</th>
                      <th class="min-desktop">Length</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      var table = new DataTable('#releasesTable', {
        ajax: {
          'url': '/api/v1/releases/?format=custom',
        },
        order: [
          [1, 'desc']
        ],
        responsive: {
          details: false,
        },
        pageLength: -1,
        columns: [{
          'data': 'name',
          'name': 'name',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/releases/${row.uuid}">${data}</a>` : '';
          },
        }, {
          'data': 'date',
          'name': 'date',
          'type': 'date',
          'width': '10rem',
          'render': function(data, type, row, meta) {
            return data
          }
        }, {
          'data': 'type',
          'name': 'type',
          'width': '10rem',
        }, {
          'data': 'length',
          'name': 'length',
          'width': '10rem',
        }],
        initComplete: function(settings, json) {
          var api = this.api();
          let info = api.page.info()

          const tableInfo = document.getElementById('tableInfo');

          tableInfo.textContent = `Showing ${info.start + 1} to ${info.end} of ${info.recordsTotal} entries`;

          api.on('draw', () => {
            const pageInfo = api.page.info();
            tableInfo.textContent = `Showing ${pageInfo.start + 1} to ${pageInfo.end} of ${pageInfo.recordsTotal} entries`;
          });
        }
      });

      $('#PublicityFilter').on('change', function() {
        var selectedValue = this.value;
        table.order([
          [1, 'desc']
        ]).column(2).search(selectedValue ? selectedValue : '', true, false).draw();
      });

      tableSearch(table, 'search');
    });
  </script>
{% endblock content %}
