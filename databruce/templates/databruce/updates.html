{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12 col-lg-10">
    <div class="row mb-2">
      <div class="text-2xl">
        <a href="{% url 'index' %}">Databruce</a> &gt; Updates
      </div>
    </div>
    <div class="row mb-2">
      <div class="text-base">
        This is a running list of new additions to the database. To keep things simple, I've limited it to the last 1000 additions.
      </div>
    </div>
    <div class="row mb-3">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <div class="row align-items-end d-flex row-gap-2 gx-1" id="tableControls">
              <!-- Search -->
              <div class="col">
                <label for="search" class="pb-1">Search</label>
                <div class="input-group input-group-sm">
                  <input type="text"
                         id="search"
                         class="form-control form-control-sm"
                         placeholder="Type to search table...">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="updateTable">
                  <thead>
                    <tr>
                      <th class="all">Date</th>
                      <th class="all">Description</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      var table = new DataTable('#updateTable', {
        ajax: {
          'url': '/api/v1/updates/?format=custom',
        },
        columns:[
          {
            'data': 'created_at',
            'name': 'created_at',
            'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                return data
              }
            },
          },
          {
            'data': 'msg',
            'name': 'msg',
            'render': function (data, type, row, meta) {
              if (type === 'display' && data) {
                if (row.view) {
                  return `${data} <a class='text-reset fw-medium text-accent' href='/${row.view}/${row.item_id}'>${row.value}</a>`
                }

                return data
              }
            },
          },
        ]
      });

      tableSearch(table, 'search');
    });
  </script>
{% endblock content %}
