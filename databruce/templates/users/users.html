{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Users</div>
        <div class="text-base">All active users on the site</div>
      </div>
    </div>
    <div class="row justify-content-center align-items-center mt-3">
      <div class="col-12">
        <a class="btn btn-neutral text-sm w-100 collapse-toggle"
           id="filterCollapseToggle"
           data-bs-toggle="collapse"
           href="#filterCollapse"
           role="button"
           aria-expanded="false"
           aria-controls="filterCollapse">
          <span id="collapseText">Show Filters</span>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="16"
               height="16"
               fill="currentColor"
               class="bi bi-chevron-down collapse-icon"
               viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
          </svg>
        </a>
      </div>
    </div>
    <div class="collapse" id="filterCollapse">
      <div class="flex-column d-grid row-gap-2 pt-3 px-1">
        <div class="col-12 d-flex align-items-center justify-content-center gap-2">
          <label for="search" class="form-label col-2 col-md-1 text-nowrap">Search</label>
          <div class="input-group input-group-sm">
            <input type="text"
                   id="search"
                   class="form-control form-control-sm"
                   placeholder="Type to search table...">
          </div>
        </div>
        <div class="d-flex col-12 align-items-center justify-content-center justify-content-sm-start gap-2"
             id="dropdown-container">
          <label for="tableOrder" class="form-label col-2 col-md-1 text-nowrap">Order By:</label>
          <select name=""
                  id="tableOrder"
                  class="form-select form-select-sm column-order"
                  autocomplete="off">
            <option value="0-asc" selected></option>
          </select>
        </div>
      </div>
    </div>
    <div class="row my-3">
      <div class="d-flex flex-sm-row align-items-center justify-content-center column-gap-3 flex-wrap"
           id="controls">
        {% include "databruce/partials/table_pagination.html" %}
        <div class="dt-info order-3"
             aria-live="polite"
             role="status"
             id="tableInfo"></div>
      </div>
    </div>
    <div class="row mt-2 mb-3">
      <div class="col">
        <div class="card">
          <div class="card-body p-0">
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="userTable">
                  <thead>
                    <tr>
                      <th class="all">Staff?</th>
                      <th class="all text-nowrap">Shows Seen</th>
                      <th class="all">Name</th>
                      <th class="all text-nowrap">Date Joined</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function() {
      var table = new DataTable('#userTable', {
        ajax: {
          'url': '/api/v1/users/?format=custom'
        },
        responsive: {
          details: false,
        },
        columnDefs: [{
          'targets': '_all',
          'className': 'dt-left'
        }, {
          'targets': [0, 1],
          'width': '1rem',
          'className': 'dt-center'
        }, {
          'targets': [0],
          'columnControl': []
        }, {
          'targets': [1],
          'type': 'num'
        }, {
          'targets': [2],
          'className': 'dt-left'
        }, {
          'targets': [-1],
          'type': 'text'
        }, ],
        columns: [{
          'data': 'is_staff',
          'name': 'is_staff',
          'orderable': false,
          'searchable': false,
          'render': function(data, type, row, meta) {
            return data ? `<i class="bi bi-check-lg text-base check"></i>` : '';
          },
        }, {
          'data': 'count',
          'name': 'num_events'
        }, {
          'data': 'uuid',
          'name': 'username',
          'render': function(data, type, row, meta) {
            return data ? `<a href="/profile/${data}">${row.username}</a>` : '';
          },
        }, {
          'data': 'date_joined',
          'name': 'date_joined'
        }, ],
        initComplete: function() {
          let api = this.api();
          let info = api.page.info();
          const input = $('.page-input');
          const prevBtn = $('.btn-prev');
          const nextBtn = $('.btn-next');
          const totalSpan = $('.total-pages');
          const tableInfo = $('#tableInfo');

          // Initial button states
          input.val(info.page + 1);
          prevBtn.attr('disabled', info.page === 0);
          nextBtn.attr('disabled', info.page >= info.pages - 1);

          tableInfo.text(`Showing ${info.start + 1} to ${info.end} of ${info.recordsTotal} entries`);

          api.on('draw', () => {
            const pageInfo = api.page.info();

            input.val(pageInfo.page + 1);
            input.attr('max', pageInfo.pages);

            totalSpan.text(`of ${pageInfo.pages || 1}`);

            // Handle button states
            prevBtn.attr('disabled', pageInfo.page === 0);
            nextBtn.attr('disabled', pageInfo.page >= pageInfo.pages - 1);

            // FIX: Swapped out 'info' for 'pageInfo' so it updates dynamically
            tableInfo.text(`Showing ${pageInfo.start + 1} to ${pageInfo.end} of ${pageInfo.recordsTotal} entries`);
          });

          totalSpan.text(`of ${info.pages || 1}`);

          nextBtn.on('click', function() {
            nextPage(table)
          });

          prevBtn.on('click', function() {
            prevPage(table);
          });

          input.on('change', function() {
            let val = parseInt(this.value, 10) - 1;
            const max = api.page.info().pages - 1;
            if (val < 0) val = 0;
            if (val > max) val = max;

            input.attr('value', val);

            api.page(val).draw('page');
          });
          let tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));

          tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
          });
        }
      });

      tableSearch(table, 'search');
    });
  </script>
{% endblock content %}
