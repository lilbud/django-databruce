{% extends "databruce/narrow_layout.html" %}
{% block title %}
  {{ title }}
{% endblock title %}
{% block content %}
  <div class="col-12">
    <div class="row mb-3">
      <div class="col">
        <div class="text-2xl">Users</div>
        <div class="text-base">All active users on the site</div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <div class="row align-items-end d-flex row-gap-2 gx-2" id="tableControls">
              <!-- Search -->
              <div class="col">
                <label for="search" class="pb-1">Search</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>
                  <input type="text"
                         id="search"
                         class="form-control form-control-sm"
                         placeholder="Type to search table...">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="table-responsive">
                <table class="table table-hover display" id="userTable">
                  <thead>
                    <tr>
                      <th class="all">Staff?</th>
                      <th class="all text-nowrap">Shows Seen</th>
                      <th class="all">Name</th>
                      <th class="all text-nowrap">Date Joined</th>
                    </tr>
                  </thead>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      var table = new DataTable('#userTable', {
        ajax: {
          'url': '/api/v1/users/?format=custom'
        },
        columnDefs: [
          {'targets': '_all', 'className': 'dt-left' },
          {'targets': [0, 1], 'width': '1rem', 'className': 'dt-center' },
          {'targets': [0], 'columnControl': [] },
          {'targets': [1], 'type': 'num' },
          {'targets': [2], 'className': 'dt-left' },
          {'targets': [-1], 'type': 'text' },
        ],
        columns: [
          {
            'data': 'is_staff',
            'name': 'is_staff',
            'render': function (data, type, row, meta) {
              if (type === 'display') {
                return data ? `<i class="bi bi-check-lg text-base check"></i>` : '';
              }
            },
          },
          { 'data': 'event_count', 'name': 'event_count' },
          { 
            'data': 'uuid',
            'name': 'user_slug',
            'render': function (data, type, row, meta) {
              if (type === 'display') {
                return `<a href="/profile/${data}">${row.username}</a>`
              }
            },
          },
          { 'data': 'date_joined', 'name': 'date_joined' },
        ]
      });
      
      tableSearch(table, 'search');
    });
  </script>
{% endblock content %}
